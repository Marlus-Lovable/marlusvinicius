<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages doesn't serve SPA routes (e.g. /projects/slug).
      // With HashRouter, we can always redirect 404s to /#/...
      (function () {
        var l = window.location;
        var repoName = "marlusvinicius";
        var isProjectPage = l.pathname.indexOf("/" + repoName + "/") === 0;
        var basePath = isProjectPage ? "/" + repoName + "/" : "/";

        // Remove leading base path so /marlusvinicius/projects/x -> projects/x
        var pathWithoutBase = l.pathname.slice(basePath.length);
        if (pathWithoutBase.charAt(0) === "/") pathWithoutBase = pathWithoutBase.slice(1);

        var target =
          l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          basePath +
          "#/" +
          pathWithoutBase +
          (l.search || "");

        l.replace(target);
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
